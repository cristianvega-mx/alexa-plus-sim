<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexa+ Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="device-column">
        <div class="device">
          <div class="screen" id="screen">
            <header class="status">
              <span id="clock"></span>
              <span class="skill" id="skill">Conectando…</span>
            </header>
            <section class="content" id="content"></section>
            <div class="captions">
              <p class="caption-user" id="caption-user" hidden></p>
              <p class="caption-translation" id="caption-user-translation" hidden></p>
              <p class="caption-alexa" id="caption-alexa" hidden></p>
              <p class="caption-translation" id="caption-alexa-translation" hidden></p>
            </div>
            <div class="light-bar" id="light-bar"></div>
          </div>
        </div>
        <form class="console" id="console">
          <button type="button" class="mic" id="mic" title="Hablar (barra espaciadora)" aria-label="Hablar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" /></svg>
          </button>
          <input id="text" autocomplete="off" placeholder="O escriba lo que diría en voz alta…" />
          <button type="submit" class="send">Enviar</button>
          <button type="button" class="ghost" id="reset" title="Empezar una conversación nueva">Reiniciar</button>
        </form>
      </section>
      <aside class="log">
        <h2>MCP traffic</h2>
        <ol id="log"></ol>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
